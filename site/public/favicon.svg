<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="カピバラ日和">
  <!-- 生成り地（新パレット・角丸） -->
  <rect x="0" y="0" width="64" height="64" rx="15" fill="#f7f2e9"/>
  <!-- 湯けむり（細線・単色） -->
  <g fill="none" stroke="#c9b99f" stroke-width="2" stroke-linecap="round">
    <path d="M24 15c-2-2 2-3.2 0-5.2"/>
    <path d="M32 12.5c-2-2 2-3.2 0-5.2"/>
    <path d="M40 15c-2-2 2-3.2 0-5.2"/>
  </g>
  <!-- 耳 -->
  <circle cx="18" cy="24" r="5.2" fill="#a85320"/>
  <circle cx="46" cy="24" r="5.2" fill="#a85320"/>
  <!-- 頭（俵型の丸い輪郭） -->
  <rect x="12" y="20" width="40" height="34" rx="16" fill="#c9682f"/>
  <!-- 四角い鼻先 -->
  <rect x="20" y="38" width="24" height="16" rx="7" fill="#e7b48f"/>
  <!-- 点の目 -->
  <circle cx="25" cy="33" r="2.6" fill="#3a2e22"/>
  <circle cx="39" cy="33" r="2.6" fill="#3a2e22"/>
  <!-- 鼻の穴 -->
  <circle cx="28.5" cy="46" r="1.8" fill="#3a2e22"/>
  <circle cx="35.5" cy="46" r="1.8" fill="#3a2e22"/>
</svg>
